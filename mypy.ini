# Settings for mypy, the tool that checks the code matches its type hints.
# CI runs `mypy` on every push. The files to check are listed below.
[mypy]
python_version = 3.14
files = jarvis, scripts, tests

# Also look inside functions that have no type hints.
check_untyped_defs = True

# Find scripts/ and tests/ by folder name, the same way pytest does.
explicit_package_bases = True

# LangChain's classes are built with pydantic. This plugin lets mypy understand
# their settings, such as ChatAnthropic(model=...). Without it they look wrong.
plugins = pydantic.mypy
